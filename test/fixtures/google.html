<script>AF_initDataCallback({key: 'ds:1', hash: '1', data:[[["109976286780105414","Software Engineering PhD Intern, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckaHITIu4Cs9zGmbHYPd6eydSzQjWpUSdDPs94uV6zbidEjsA1Ny_i7SQFqRUru7iI4aTrhu0-8F4k7gnef0Gmc7qpIdS8KYXplaO4bUGjWIrdwR7qe9nztuu9mPWuQ%3D%3D_V2&loc=IN&title=Software+Engineering+PhD+Intern",[null,"<ul>\n<li>Foster a culture of productivity and innovation by actively supporting your peers and managers. Collaborate across teams to ensure the continued success and evolution of the AI-driven software and large-scale systems that define our technical landscape.</li>\n<li>Develop scalable engineering solutions for Google products.</li>\n<li>Analyze information and evaluate results to choose the best solution to effectively solve issues.</li>\n<li>Apply knowledge gained in computer science courses to real world challenges.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li><div><div>Pursuing a PhD program with a focus in software development or other technical related field.</div></div></li>\n<li>Experience with one or more general purpose programming languages (e.g., Java, C/C++, Python, JavaScript, Go, etc.).<br></li>\n<li>Experience working in Unix/Linux environments.<br></li>\n<li>Experience with data structures, algorithms, and software design.<br></li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Research experience in algorithms, architecture, artificial intelligence, compilers, database, data mining, distributed systems, machine learning, networking, or systems.</li>\n<li>Programming experience in one or more of the following: C/C++, C#, Java, JavaScript, Python Objective C, Go or similar.</li>\n<li>Experience in computer science, with competencies in data structures, algorithms and software design.<br></li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bengaluru, Karnataka, India",["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"],"Bengaluru","560038","KA","IN"],["Hyderabad, Telangana, India",["Hyderabad, Telangana, India"],"Hyderabad",null,"TS","IN"],["Pune, Maharashtra, India",["Pune, Maharashtra, India"],"Pune",null,"MH","IN"]],[null,"<p>Join us for a 12+ week paid internship that offers personal and professional development, an executive speaker series, and community-building. The Software Engineering Internship program will give you an opportunity to work on complex computer science solutions, develop scalable, distributed software systems, and also collaborate on multitudes of smaller projects that have universal appeal.</p><p>Our recruitment team will determine where you fit best based on your resume.</p><p>As a Software Engineering Intern, you will work on a specific project critical to Google’s needs.</p><p>Software Engineering Intern:</p><p>You will be a key player on a dynamic team, driving the development of AI-integrated software and high-performance applications. Your primary objective is to design, deploy, and maintain the end-to-end infrastructure that sustains our large-scale systems. This is a unique opportunity to contribute to Google’s core needs while evolving your technical expertise in a fast-paced, real-world environment.</p><p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at a massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p><p>Google is and always will be an engineering company. We hire people with a broad set of technical skills who are ready to address some of technology's greatest challenges and make an impact on millions, if not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.</p>"],[4],[1788764944,626000000],[1788764944,626000000],[1788764945,18000000],[null,""],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Bengaluru, Karnataka, India; Hyderabad, Telangana, India; Pune, Maharashtra, India</b>."],[null,"<ul>\n<li><div><div>Pursuing a PhD program with a focus in software development or other technical related field.</div></div></li>\n<li>Experience with one or more general purpose programming languages (e.g., Java, C/C++, Python, JavaScript, Go, etc.).<br></li>\n<li>Experience working in Unix/Linux environments.<br></li>\n<li>Experience with data structures, algorithms, and software design.<br></li>\n</ul>"],5],["109375266236572358","Silicon Engineering Intern, PhD, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckdSghlr4Tzq7TjJKD77g1aHCNuomQxdBFImE2GK91p5ZEjsA1Ny_i81niMllXjziWbyTDmdLe0PmpnEl3FjEoWnvXhktA_nq1WWCNuHYyKc-m_5UgSeYLyhNKrQVtw%3D%3D_V2&loc=IN&title=Silicon+Engineering+Intern",[null,"<ul>\n<li>Responsibilities may vary based on specific teams.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Currently pursuing a PhD degree in Computer Engineering, Computer Science, Electronics and Communication Engineering, Electrical Engineering, or a related technical field.</li>\n<li>Experience in programming languages (e.g., C++, Python, Verilog, UVM), Synopsys, and Cadence tools.</li>\n<li><div><div>Experience in one or more of the following areas: hardware system integration, product design, computer architecture, digital design verification, digital circuits, ASIC physical design, FPGAs, embedded systems, memory systems.</div></div></li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Currently attending a degree program in India and available to work full time for 12 weeks outside of university term time.</li>\n<li>Experience with performance modeling tools, C++, Python or silicon design tools in front end/design verification/physical design.</li>\n<li>Knowledge of arithmetic units, bus architectures, accelerators or memory hierarchies, computer architecture, linear algebra, or ML/DL background.</li>\n<li>Knowledge of high performance and low power design techniques.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bengaluru, Karnataka, India",["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"],"Bengaluru","560038","KA","IN"],["Hyderabad, Telangana, India",["Hyderabad, Telangana, India"],"Hyderabad",null,"TS","IN"]],[null,"<p>As a Silicon Engineering Intern, you will work in a team that is shaping the future of Google Cloud Silicon, including TPUs, arm-based servers, and network products. You will collaborate with hardware and software architects and designers to architect, model, analyze, define, and design next-generation Cloud Silicon. You will have dynamic, multi-faceted responsibilities in areas such as product definition, design and implementation, collaborating with the Engineering teams to drive the optimal balance between performance, power, features, schedule, and cost.</p><p>The ML, Systems, and Cloud AI (MSCA) organization at Google designs, implements and manages the hardware, software, machine learning and systems infrastructure for all Google services (e.g., Search, YouTube, etc.) and Google Cloud. Our end users are Googlers, Cloud customers, and people who use Google services around the world. We prioritize security, efficiency, and reliability across everything we do - from developing our latest Cloud Silicon products to running a global network, while driving towards shaping the future of hyperscale computing. </p><p>Google is and always will be an engineering company. We hire people with a broad set of technical skills who are ready to address some of technology's greatest challenges and make an impact on millions, if not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.</p>"],[4],[1788768524,756000000],[1788768524,756000000],[1788768524,876000000],[null,"<p>Please complete your application before <b>April 30, 2027</b>.</p>"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Bengaluru, Karnataka, India; Hyderabad, Telangana, India</b>."],[null,"<ul>\n<li>Currently pursuing a PhD degree in Computer Engineering, Computer Science, Electronics and Communication Engineering, Electrical Engineering, or a related technical field.</li>\n<li>Experience in programming languages (e.g., C++, Python, Verilog, UVM), Synopsys, and Cadence tools.</li>\n<li><div><div>Experience in one or more of the following areas: hardware system integration, product design, computer architecture, digital design verification, digital circuits, ASIC physical design, FPGAs, embedded systems, memory systems.</div></div></li>\n</ul>"],5],["75184274717713094","Software Engineer, Knowledge Catalog Data Products","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckfaDHad4rfUUuLDOIp-6uc8j4VeMvnD31msGEH2FXq35EjsA9yzvgs7G8hitPTSlE6uOgStZ_y3Gub5LR-dkIvK_cCXisth13f0O3XQftuCQkoXb7dIJU9IJQQ9vdQ%3D%3D_V2&loc=IN&title=Software+Engineer",[null,"<ul>\n<li>Drive technical projects and make technical contributions. Coordinate and drive improvements in Knowledge Catalog engineering and operational excellence.</li>\n<li>Be a coach and technical mentor for a team of Software Engineers. Design and implement features/components to support large scale data sharing and secure/low-trust (clean room) capabilities.</li>\n<li>Collaborate with EMs/PMs to plan the charter/roadmap for knowledge catalog data products and services.</li>\n<li>Design and implement tests and experiments to evaluate and monitor the performance of the system. Interact and interface with PM/TPM for project planning and execution.</li>\n<li>Work effectively across boundaries in a distributed team setup to deliver on organizational goals. Use the full battery of tools and instrumentation to develop, test and rollout features. Work with customers to help find solutions to their blocking issues.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree or equivalent practical experience.</li>\n<li>5 years of experience with software development in one or more programming languages.</li>\n<li>3 years of experience testing, maintaining, or launching software products, and 1 year of experience with software design and architecture.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Bachelor’s degree in Computer Science or similar technical field, or an equivalent practical experience.</li>\n<li>Software development experience with one or more general purpose programming languages, including but not limited to: Java, C/C++, or Go.</li>\n<li>Strong knowledge of Data warehouses, BigData, SQL, and data governance.<br></li>\n<li>Expert level skills in developing Cloud or SaaS products.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bengaluru, Karnataka, India",["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"],"Bengaluru","560038","KA","IN"]],[null,"<p>Google Cloud's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google Cloud's needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. You will anticipate our customer needs and be empowered to act like an owner, take action and innovate. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.</p>"],[2],[1793979780,226000000],[1793979780,226000000],[1793979780,336000000],[null,"In most instances, this position requires in-person interviews as part of the hiring process"],null,null,[null,""],[null,"<ul>\n<li>Bachelor’s degree or equivalent practical experience.</li>\n<li>5 years of experience with software development in one or more programming languages.</li>\n<li>3 years of experience testing, maintaining, or launching software products, and 1 year of experience with software design and architecture.</li>\n</ul>"],2]]], sideChannel: {}});</script>
