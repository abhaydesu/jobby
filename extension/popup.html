<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jobby Companion</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px; background: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    h1 { margin: 0 0 6px; font-size: 15px; }
    p { margin: 0 0 12px; color: #a1a1aa; font-size: 12px; line-height: 1.4; }
    .btn { width: 100%; padding: 9px 12px; border: 0; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 13px; color: #fff; background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .link { display: inline-block; margin-top: 10px; color: #60a5fa; text-decoration: none; font-size: 12px; cursor: pointer; background: none; border: 0; padding: 0; }
    .status { margin-top: 10px; padding: 8px; border-radius: 7px; background: #18181b; border: 1px solid #27272a; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <h1>Jobby Capture</h1>
  <p>Extract all visible openings from LinkedIn, Wellfound, Naukri, Instahyre, or Cutshort into your local Jobby DB.</p>
  <button class="btn" id="btn-capture">Capture All on This Page</button>
  <div class="status" id="status-box"></div>
  <button class="link" id="btn-options">Extension Settings & Token</button>
  <script src="popup.js"></script>
</body>
</html>
